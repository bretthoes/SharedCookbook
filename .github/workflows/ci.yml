name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Show .NET info
        run: |
          dotnet --version
          dotnet --list-runtimes

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: '6.7.x'

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0
        with:
          configFilePath: .github/GitVersion.yml

      - name: Show GitVersion info
        run: |
          echo "fullSemVer      = ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "semVer          = ${{ steps.gitversion.outputs.semVer }}"
          echo "assemblySemVer  = ${{ steps.gitversion.outputs.assemblySemVer }}"

      - name: Tag commit with version
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          SEMVER: ${{ steps.gitversion.outputs.semVer }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $SEMVER
          git push origin $SEMVER

      - name: Build and test
        run: |
          dotnet test -c Release \
            /p:Version=${{ steps.gitversion.outputs.fullSemVer }} \
            /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} \
            /p:FileVersion=${{ steps.gitversion.outputs.assemblySemVer }} \
            -p:SkipNSwag=true

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Release ${{ github.ref_name }}:
            - (add your changelog or notes here)
