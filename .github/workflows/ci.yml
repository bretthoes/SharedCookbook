name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show .NET info
        run: |
          dotnet --version
          dotnet --list-sdks
          dotnet --list-runtimes

      - name: Verify Docker
        run: docker info

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: '6.7.x'

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0
        with:
          configFilePath: .github/GitVersion.yml

      - name: Show GitVersion info
        run: |
          echo "fullSemVer      = ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "semVer          = ${{ steps.gitversion.outputs.semVer }}"
          echo "assemblySemVer  = ${{ steps.gitversion.outputs.assemblySemVer }}"

      - name: Build
        run: |
          dotnet build SharedCookbook.slnx -c Release \
            /p:Version=${{ steps.gitversion.outputs.fullSemVer }} \
            /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} \
            /p:FileVersion=${{ steps.gitversion.outputs.assemblySemVer }} \
            -p:SkipNSwag=true

      - name: Test
        run: |
          dotnet test tests/Domain.UnitTests/Domain.UnitTests.csproj -c Release --no-build
          dotnet test tests/Application.UnitTests/Application.UnitTests.csproj -c Release --no-build
          dotnet test tests/Infrastructure.UnitTests/Infrastructure.UnitTests.csproj -c Release --no-build
          dotnet test tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj -c Release --no-build
          dotnet test tests/Application.FunctionalTests/Application.FunctionalTests.csproj -c Release --no-build
